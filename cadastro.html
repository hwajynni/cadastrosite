<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cadastro">
    <header>
        <h1>KPOP STORE</h1>
        <p>Crie sua conta!</p>
    </header>

   <main>
     <h2>Faça o seu cadastro:</h2>

     <form id="formCadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o seu nome" required>
        <br><br>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"  placeholder="Digite o seu e-mail"required>
        <br><br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha"  placeholder="Digite a sua senha" required>
        <br><br>
         <label for="contato">Contato:</label>
        <input type="text" id="contato" name="contato" placeholder="Digite o seu número de telefone" required>
        <br><br>
        <label for="endereço">Endereço:</label>
        <input type="text" id="endereço" name="endereço" placeholder="Digite o seu endereço" required>
        <br><br>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
        <br><br>
        <label for="foto">Foto de perfil:</label>
        <input type="file" id="foto" accept="image/*">
        <br><br>
        <button type="submit">Cadastrar agora</button>
     </form>

   </main>

   <script src="script.js"></script>
</body>
</html>
